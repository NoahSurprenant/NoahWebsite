<main class="app-frame">

    <!-- Each theme draws the whole page: the name, the links and whatever goes behind them -->
    @switch (theme()) {
        @case ('terminal') { <app-terminal-theme></app-terminal-theme> }
        @case ('xbox') { <app-xbox-theme></app-xbox-theme> }
        @case ('mecha') { <app-mecha-theme></app-mecha-theme> }
        @default { <app-skyrim-theme></app-skyrim-theme> }
    }

    <app-theme-switcher></app-theme-switcher>

    @if (displayWatermark()) {
    <div class="windows-watermark">
        Activate Windows<br>
        Go to Settings to activate Windows.
    </div>
    }
</main>
