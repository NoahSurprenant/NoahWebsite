<div #dashboard class="dashboard">
    <div #backdrop class="backdrop" aria-hidden="true"></div>
    <!-- Pressing the orb mustn't take the focus, and with it the selection, off the menu -->
    <div #orb class="orb" aria-hidden="true" (mousedown)="$event.preventDefault()"></div>

    <h1 #heading class="name">{{ name }}</h1>

    <!-- Each item: a glossy pod on an arc around the orb, wired to a bar. The lit one is the one
         with the keyboard focus, and the pointer moves the focus, so there's only ever one. -->
    <nav #menu class="menu" (keydown)="onKeydown($event)">
        @for (link of links; track link.id; let i = $index) {
        <a [href]="link.href" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label" [style.--i]="i" [style.--arc]="arc[i]"
            (mouseenter)="hover($event)">
            <span class="pod"></span>
            <span class="bar"><span>{{ link.short }}</span></span>
        </a>
        }
    </nav>

    <app-select-hint #hints></app-select-hint>
</div>
