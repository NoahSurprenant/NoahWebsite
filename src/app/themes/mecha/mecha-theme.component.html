<div class="screen">
    <div class="grid" aria-hidden="true">
        <!-- A honeycomb of flat-topped hexagons, 52px across: one hexagon and the edge joining it to
             the next column per tile, the tile's other edges coming from its neighbours -->
        <svg class="honeycomb">
            <defs>
                <pattern id="mecha-honeycomb" width="78" height="45.0333" patternUnits="userSpaceOnUse">
                    <path d="M13 0H39L52 22.5167 39 45.0333H13L0 22.5167ZM52 22.5167H78" />
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#mecha-honeycomb)" />
        </svg>
        @for (flash of flashes; track $index) {
        <i [style.left]="flash.left" [style.top]="flash.top" [style.animation-delay]="flash.delay" [style.animation-duration]="flash.duration">
            <svg viewBox="0 0 52 45.0333"><path d="M13 0H39L52 22.5167 39 45.0333H13L0 22.5167Z" /></svg>
        </i>
        }
    </div>

    <app-title-card class="card"></app-title-card>

    <app-hud #hud class="hud"></app-hud>

    <nav class="console" aria-label="Links">
        <p class="console-header" aria-hidden="true"><span>HQ</span> LINK STATUS: ONLINE</p>
        <ul>
            @for (link of links; track link.id) {
            <li>
                <a [href]="link.href" target="_blank" rel="noopener noreferrer" [attr.aria-label]="link.label">
                    <fa-icon [icon]="link.icon"></fa-icon>
                    <span>{{ link.short }}</span>
                </a>
            </li>
            }
        </ul>
    </nav>

    <app-banner class="banner"></app-banner>

    <!-- On top of everything, but clicks go through: the links keep working in the dark -->
    <app-power-down class="power" [power]="hud.power()"></app-power-down>
</div>
