<div #canvasHost class="canvas-host"></div>

<p class="caption" [textContent]="item().caption">You got a cat</p>

@if (item().attribution?.url == undefined) {
    <div>
        <p class="attribution" [textContent]="$safeNavigationMigration(item().attribution?.short)" [title]="$safeNavigationMigration(item().attribution?.long)"></p>
    </div>
} @else {
    <div>
        <a [href]="$safeNavigationMigration(item().attribution?.url)" target="_blank">
            <p class="attribution" [textContent]="$safeNavigationMigration(item().attribution?.short)" [title]="$safeNavigationMigration(item().attribution?.long)"></p>
        </a>
    </div>
}
